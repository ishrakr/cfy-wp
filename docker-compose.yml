services:

  php:
    build: .
    restart: always
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - html:/var/www/html
    depends_on:
      - db
      - cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: mariadb:10.11
    restart: always
    command: [
      "mysqld",
      "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE}",
      "--innodb-log-file-size=${MYSQL_INNODB_LOG_FILE_SIZE}",
      "--max-connections=${MYSQL_MAX_CONNECTIONS}"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY}"]
    volumes:
      - redis_data:/data
