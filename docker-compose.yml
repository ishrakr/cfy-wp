services:

  php:
    build: .
    restart: always
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - ./html:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80,$$e,$$m,2); if (!$$s) exit(1); mysqli_report(MYSQLI_REPORT_OFF); $$db=@new mysqli(getenv(\"WORDPRESS_DB_HOST\"),getenv(\"WORDPRESS_DB_USER\"),getenv(\"WORDPRESS_DB_PASSWORD\"),getenv(\"WORDPRESS_DB_NAME\")); exit($$db->connect_errno ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: mariadb:10.11
    restart: always
    command: [
      "mysqld",
      "--innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-256M}",
      "--max-connections=${MARIADB_MAX_CONNECTIONS:-100}"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
